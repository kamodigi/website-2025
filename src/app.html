<!doctype html>
<html lang="%paraglide.lang%">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- 最初の描画前にテーマを決める（ちらつき防止）。localStorage "theme" > OS の設定。ThemeToggle.svelte と合わせること -->
	<script>
		(function () {
			var theme;
			try {
				theme = localStorage.getItem('theme');
			} catch (e) {}
			if (theme !== 'light' && theme !== 'dark') {
				theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@100..700&family=Noto+Sans+JP:wght@100..900&display=swap"
		rel="stylesheet">
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
