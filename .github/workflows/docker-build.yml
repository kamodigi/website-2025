name: Docker build

# PR で Dockerfile からイメージがビルドできることだけを確かめる（push はしない）。
# public リポジトリのため pull_request_target は使わない。pull_request なら、外部（fork）からの PR には
# secret が渡らず、GITHUB_TOKEN も読み取り専用になる。このワークフローは secret も packages: write も使わない。
on:
  pull_request:

concurrency:
  group: docker-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # キャッシュは読むだけにする（PR から main のキャッシュを書き換えない）
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
